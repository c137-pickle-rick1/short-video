<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lagos Explore Feed</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="overflow-x-hidden bg-[#f8f2eb] text-[#211b17] antialiased">
    <div
      class="pointer-events-none fixed left-[-10rem] top-[-11rem] z-0 h-[34rem] w-[34rem] rounded-full bg-[rgba(241,109,76,0.28)] blur-[92px]"
    ></div>
    <div
      class="pointer-events-none fixed right-[-8rem] top-[8rem] z-0 h-[26rem] w-[26rem] rounded-full bg-[rgba(255,212,180,0.55)] blur-[76px]"
    ></div>

    <main class="relative z-10 px-3 pb-12 pt-4 sm:px-5 lg:px-8">
      <div class="mx-auto w-full max-w-[1520px]">
        <header
          class="rounded-[2rem] border border-white/70 bg-[rgba(255,250,246,0.84)] p-4 shadow-glass backdrop-blur-2xl sm:p-6"
        >
          <div class="flex flex-wrap items-center gap-3">
            <div
              class="inline-flex items-center gap-3 rounded-full bg-[#211b17] px-4 py-2 text-sm font-semibold uppercase tracking-[0.28em] text-[#fff8f1]"
            >
              <span class="h-2.5 w-2.5 rounded-full bg-[#f2684a]"></span>
              Lagos
            </div>
            <div
              class="flex min-w-[15rem] flex-1 items-center gap-3 rounded-full border border-[#eadfd4] bg-white/90 px-4 py-3 text-sm text-[#7c6a5d]"
            >
              <span class="flex h-8 w-8 items-center justify-center rounded-full bg-[#f7eee6] text-base">
                ⌕
              </span>
              <div class="min-w-0">
                <p class="truncate font-medium text-[#211b17]">本地视频探索页</p>
                <p class="truncate text-xs text-[#8d7b6f]">参考小红书 explore 的首页布局重组</p>
              </div>
            </div>
          </div>

          <div class="mt-6">
            <p class="text-[0.78rem] font-semibold uppercase tracking-[0.34em] text-[#d14d34]">
              Explore Feed
            </p>
            <h1
              class="mt-3 max-w-[10ch] font-serif text-[clamp(2.5rem,4.4vw,4.5rem)] leading-[0.92] text-[#211b17]"
            >
              用 explore 的方式浏览本地短视频
            </h1>
            <p class="mt-4 max-w-2xl text-[0.98rem] leading-7 text-[#7b695c]">
              保留当前抓取与解析能力，首页只保留来源筛选和卡片式内容流，减少说明性模块干扰。
            </p>
          </div>
        </header>

        <section class="mt-6">
          <div class="min-w-0">
            <section
              class="sticky top-4 z-20 grid gap-4 rounded-[1.75rem] border border-white/70 bg-[rgba(255,250,246,0.86)] px-4 py-4 shadow-glass backdrop-blur-2xl sm:px-5"
            >
              <div class="flex flex-wrap items-center justify-between gap-3">
                <div>
                  <p class="text-[0.78rem] uppercase tracking-[0.2em] text-[#9b8577]">频道切换</p>
                  <h2 class="mt-1 text-[1.45rem] font-semibold tracking-[-0.03em] text-[#211b17]">
                    发现
                  </h2>
                </div>
                <div class="flex flex-wrap items-center gap-3">
                  <label class="sr-only" for="source-filter">来源筛选</label>
                  <select
                    id="source-filter"
                    class="min-w-[13rem] appearance-none rounded-full border border-[#eadfd4] bg-white px-4 py-2.5 text-sm text-[#211b17] shadow-[0_10px_30px_rgba(58,27,12,0.05)] outline-none transition focus:border-[#d14d34]/40 focus:ring-2 focus:ring-[#d14d34]/20"
                  >
                    <option value="">全部来源</option>
                  </select>
                  <span
                    class="rounded-full bg-[#211b17] px-3 py-2 text-sm font-medium text-white"
                    id="feed-status"
                  >
                    正在启动
                  </span>
                </div>
              </div>
              <div id="source-chips" class="flex flex-wrap gap-2.5"></div>
            </section>

            <div class="mt-5 flex flex-wrap items-end justify-between gap-3 px-1">
              <div>
                <p class="text-[0.78rem] uppercase tracking-[0.2em] text-[#9b8577]">内容流</p>
                <h3 class="mt-1 text-[1.5rem] font-semibold tracking-[-0.03em] text-[#211b17]">
                  最新视频卡片
                </h3>
              </div>
              <p id="feed-summary" class="text-sm text-[#78675d]">正在加载探索内容…</p>
            </div>

            <section
              class="feed-waterfall mt-4 columns-1 gap-5 sm:columns-2 xl:columns-3 2xl:columns-4"
              id="feed-grid"
              aria-live="polite"
            ></section>
            <div id="feed-sentinel" class="h-px" aria-hidden="true"></div>
          </div>
        </section>
      </div>
    </main>

    <template id="empty-state-template">
      <article
        class="mb-5 inline-block w-full overflow-hidden rounded-[1.75rem] border border-white/70 bg-[rgba(255,250,246,0.92)] px-6 py-8 text-center shadow-glass backdrop-blur-2xl"
        data-empty-state="true"
      >
        <div
          class="mx-auto flex h-14 w-14 items-center justify-center rounded-full bg-[#ffe7df] text-xl text-[#d14d34]"
        >
          ⌕
        </div>
        <h2 class="mt-4 text-[1.5rem] font-semibold tracking-[-0.03em] text-[#211b17]">
          还没有可展示的视频
        </h2>
        <p class="mt-3 text-sm leading-6 text-[#78675d] sm:text-base">
          先在 <code>config/sources.json</code> 启用来源并运行抓取。首页布局已经准备好，
          一旦有数据就会按瀑布流方式展示出来。
        </p>
      </article>
    </template>

    <script type="module" src="/app.js"></script>
  </body>
</html>
